services:
  app:
    build: .
    ports:
      - "${APP_PORT}:8000"
    environment:
      GREETING: "${GREETING}"
      STORAGE: sqlite
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz').close()"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  sqlite_data:
